<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - WafaStoreOnly</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
:root{--primary:#4a90e2;--accent:#6b5ce7}
body{background:#0a0a0a;color:#e8e8e8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at top,rgba(74,144,226,0.08),transparent 60%);pointer-events:none}
.card{width:100%;max-width:420px;background:#141414;border:1px solid #2a2a2a;border-radius:20px;padding:28px;position:relative;z-index:2}
.logo-box{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo-box img{width:56px;height:56px;border-radius:50%;border:1px solid #2a2a2a;object-fit:cover;background:#1a1a1a}
.logo-text{flex:1}
h1{font-size:22px;font-weight:800;letter-spacing:-0.5px;color:#e8e8e8;line-height:1.1}
.tagline{font-size:11px;color:#8a8a8a;margin-top:4px}
.sub{font-size:12px;color:#a8a8a8;line-height:1.6;margin-bottom:20px;padding:14px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px}
.btn{width:100%;padding:13px;border-radius:10px;border:none;font-weight:600;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;transition:0.15s;font-family:inherit}
.btn:hover{opacity:0.9}
.btn:active{transform:scale(0.98)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-google{background:#fff;color:#000}
.btn-discord{background:#5865F2;color:#fff}
.btn-tiktok{background:#000;color:#fff;border:1px solid #2a2a2a}
.btn-wa{background:var(--primary);color:#fff}
.btn-icon{font-size:16px;line-height:1}
input{width:100%;padding:13px 16px;border-radius:10px;border:1px solid #2a2a2a;background:#0a0a0a;color:#e8e8e8;outline:none;margin-top:10px;font-size:13px;font-family:inherit;transition:0.15s}
input:focus{border-color:var(--primary)}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#5a5a5a;font-size:11px;font-weight:500;letter-spacing:0.5px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#2a2a2a}
#recaptcha-container{margin-top:12px;transform:scale(0.9);transform-origin:left}
.footer-note{font-size:10px;color:#5a5a5a;margin-top:16px;text-align:center;line-height:1.6}
.social-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.social-grid .btn{margin-top:0}
.error-box{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.4);color:#ef4444;padding:12px 14px;border-radius:10px;font-size:12px;margin-bottom:14px;line-height:1.6;display:none}
.error-box.show{display:block}
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-weight:700;font-size:14px;gap:16px}
.loading-overlay.show{display:flex}
.spinner{width:40px;height:40px;border:3px solid #2a2a2a;border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){.card{padding:22px}}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, GoogleAuthProvider, signInWithPopup, getRedirectResult,
  RecaptchaVerifier, signInWithPhoneNumber, signInWithCustomToken,
  setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = { 
  apiKey: "AIzaSyDTkQVpME0XRQmk9Jo7eDQuf0OFY8stm_8", 
  authDomain: "wafastoreonly.firebaseapp.com", 
  databaseURL: "https://wafastoreonly-default-rtdb.asia-southeast1.firebasedatabase.app", 
  projectId: "wafastoreonly", 
  storageBucket: "wafastoreonly.firebasestorage.app", 
  messagingSenderId: "208012194307", 
  appId: "1:208012194307:web:551a540b0151333da69436" 
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

// Set persistence ke LOCAL biar session tahan error "missing initial state"
setPersistence(auth, browserLocalPersistence)
  .then(() => console.log('✅ Auth persistence: LOCAL'))
  .catch((e) => console.warn('⚠️ Persistence error:', e));

window._auth = auth;
window._db = db;
window._ref = ref;
window._get = get;
window._set = set;
window._update = update;
window._onValue = onValue;
window._provider = new GoogleAuthProvider();
window._GoogleSign = signInWithPopup;
window._getRedirectResult = getRedirectResult;
window._RecaptchaVerifier = RecaptchaVerifier;
window._signInWithPhoneNumber = signInWithPhoneNumber;
window._signInWithCustomToken = signInWithCustomToken;

// LOAD BRANDING & THEME
function loadLoginSettings(){
  onValue(ref(db, 'settings/branding'), (snap)=>{
    const d = snap.val();
    if(!d) return;
    if(d.logo){
      const logoImg = document.getElementById('loginLogo');
      if(logoImg) logoImg.src = d.logo;
      const fav = document.querySelector('link[rel="icon"]') || document.createElement('link');
      fav.rel='icon'; fav.href=d.logo;
      document.head.appendChild(fav);
    }
    if(d.brandName){
      document.getElementById('loginBrandName').innerText = d.brandName;
      document.title = 'Login - ' + d.brandName;
    }
    if(d.tagline){
      document.getElementById('loginTagline').innerText = d.tagline;
    }
  });
  onValue(ref(db, 'settings/theme'), (snap)=>{
    const d = snap.val();
    if(!d) return;
    if(d.primary) document.documentElement.style.setProperty('--primary', d.primary);
    if(d.accent) document.documentElement.style.setProperty('--accent', d.accent);
  });
}
loadLoginSettings();
</script>
</head>
<body>

<div class="card">
  <div class="logo-box">
    <img id="loginLogo" src="./logo.png" alt="logo">
    <div class="logo-text">
      <h1 id="loginBrandName">WafaStoreOnly</h1>
      <div class="tagline" id="loginTagline">Top Up Robux Cepat & Aman</div>
    </div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="sub">Login dulu biar saldo & pesanan gak ilang kalo ganti HP. Kalo belum punya akun, nanti auto daftar.</div>

  <button class="btn btn-google" id="btnGoogle"><span class="btn-icon">🔵</span> Login dengan Google</button>

  <div class="social-grid">
    <button class="btn btn-discord" id="btnDiscord"><span class="btn-icon">🎮</span> Discord</button>
    <button class="btn btn-tiktok" id="btnTiktok"><span class="btn-icon">🎵</span> TikTok</button>
  </div>

  <div class="divider">ATAU LOGIN DENGAN WHATSAPP</div>

  <input id="phone" placeholder="Nomor WA: 0838xxxx (tanpa +62)" type="tel">
  <div id="recaptcha-container"></div>
  <button class="btn btn-wa" id="btnSendOTP">Kirim Kode OTP ke WA (SMS)</button>

  <div id="otpBox" style="display:none">
    <input id="otp" placeholder="Masukkan 6 digit kode OTP" type="number" inputmode="numeric">
    <button class="btn btn-wa" id="btnVerif">Verifikasi Kode</button>
  </div>

  <div class="footer-note">Login aman via Firebase & OAuth resmi.</div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">Memproses...</div>
</div>

<script type="module">
let confirmationResult = null;
const auth = window._auth;
const db = window._db;

// ===== HELPER =====
function showError(msg){
  const box = document.getElementById('errorBox');
  if(!box) return;
  box.innerText = '❌ ' + msg;
  box.classList.add('show');
  setTimeout(()=>box.classList.remove('show'), 8000);
}
function showLoading(text){
  const ov = document.getElementById('loadingOverlay');
  const txt = document.getElementById('loadingText');
  if(txt) txt.innerText = text || 'Memproses...';
  if(ov) ov.classList.add('show');
}
function hideLoading(){
  const ov = document.getElementById('loadingOverlay');
  if(ov) ov.classList.remove('show');
}

// ===== REDIRECT AFTER LOGIN =====
function redirectAfterLogin(){
  const target = sessionStorage.getItem('wafa_redirect_after_login') || 'index';
  sessionStorage.removeItem('wafa_redirect_after_login');
  if(target === 'dompet') window.location.href = 'dompet.html';
  else if(target === 'profil') window.location.href = 'profil.html';
  else if(target === 'admin') window.location.href = 'admin.html';
  else if(target === 'roblox') window.location.href = 'index.html?open=roblox';
  else if(target === 'pesanan') window.location.href = 'index.html?open=pesanan';
  else window.location.href = 'index.html';
}

// ===== ENSURE USER DI FIREBASE =====
async function ensureUserExists(user, extra){
  const snap = await get(ref(db, 'users/'+user.uid));
  if(!snap.exists()){
    let defaultName = user.displayName || 
                      (user.email ? user.email.split('@')[0] : '') || 
                      user.phoneNumber || 
                      'User';
    const userData = {
      uid: user.uid,
      email: user.email || (extra && extra.email) || '',
      phone: user.phoneNumber || (extra && extra.phone) || '',
      name: defaultName,
      nickname: defaultName,
      avatar: user.photoURL || (extra && extra.avatar) || '',
      provider: (extra && extra.provider) || 'unknown',
      saldo: 0,
      created: Date.now()
    };
    await set(ref(db, 'users/'+user.uid), userData);
    console.log('✅ User baru dibuat:', user.uid);
  }
  localStorage.setItem('wafa_uid', user.uid);
  const fresh = (await get(ref(db, 'users/'+user.uid))).val();
  if(fresh){
    localStorage.setItem('wafa_user', JSON.stringify({
      nickname: fresh.nickname || fresh.name || 'User',
      email: fresh.email || '',
      saldo: fresh.saldo || 0
    }));
  }
}

// ===== CEK URL QUERY =====
const urlParams = new URLSearchParams(window.location.search);
const customToken = urlParams.get('custom_token');
const providerParam = urlParams.get('provider');
const errorParam = urlParams.get('error');

if(errorParam){
  showError(decodeURIComponent(errorParam));
  window.history.replaceState({}, '', 'login.html');
}

// ===== HANDLE CUSTOM TOKEN (Discord/TikTok) =====
if(customToken){
  (async function(){
    try{
      showLoading('Login via ' + (providerParam || 'OAuth') + '...');
      console.log('🔐 Signing in with custom token from', providerParam);
      const result = await signInWithCustomToken(auth, customToken);
      const user = result.user;
      console.log('✅ Logged in as:', user.uid);
      window.history.replaceState({}, '', 'login.html');
      await ensureUserExists(user, { provider: providerParam });
      showLoading('Login berhasil!');
      setTimeout(redirectAfterLogin, 300);
    } catch(e){
      console.error('Custom token login error:', e);
      hideLoading();
      showError('Gagal login: ' + e.message);
      window.history.replaceState({}, '', 'login.html');
    }
  })();
}

// ===== INIT RECAPTCHA =====
try{
  window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'normal', theme: 'dark' });
  window.recaptchaVerifier.render();
}catch(e){ console.log('Recaptcha init error:', e); }

// ============================================
// LOGIN GOOGLE — PAKAI POPUP (biar ga error sessionStorage)
// ============================================
document.getElementById('btnGoogle').onclick = async function(){
  try{
    console.log('🔵 Login Google via POPUP...');
    const result = await signInWithPopup(auth, new GoogleAuthProvider());
    const user = result.user;
    console.log('✅ Google login sukses:', user.uid);
    await ensureUserExists(user, { provider: 'google.com' });
    showLoading('Login berhasil!');
    setTimeout(redirectAfterLogin, 300);
  }catch(e){
    console.error('Google login error:', e);
    if(e.code === 'auth/cancelled-popup-request' || e.code === 'auth/popup-closed-by-user'){
      showError('Login dibatalkan. Coba klik lagi ya 🙏');
    } else if(e.code === 'auth/popup-blocked'){
      showError('Popup diblokir browser. Izinkan popup dulu di setelan Chrome, terus klik lagi.');
    } else if(e.code === 'auth/network-request-failed'){
      showError('Koneksi internet bermasalah. Cek koneksi lo.');
    } else {
      showError('Login Google gagal: ' + e.message);
    }
  }
};

// ===== HANDLE REDIRECT RESULT (fallback untuk Google redirect lama) =====
getRedirectResult(auth).then(async function(result){
  if(result && result.user){
    const user = result.user;
    try{
      await ensureUserExists(user, { provider: 'google.com' });
      showLoading('Login berhasil!');
      setTimeout(redirectAfterLogin, 300);
    } catch(e){
      showError('Gagal simpan user: ' + e.message);
    }
  }
}).catch(function(e){ 
  console.log('Redirect result error:', e);
  // Kalau error "missing initial state", cuma log aja — gak munculin error ke user
  if(e.code === 'auth/argument-error' || e.message.includes('missing initial state')){
    console.log('ℹ️ Ignore "missing initial state" error — bakal pakai Popup');
  }
});

// ============================================
// WHATSAPP OTP
// ============================================
document.getElementById('btnSendOTP').onclick = async function(){
  let phone = document.getElementById('phone').value.trim();
  if(phone.startsWith('0')) phone = '+62' + phone.slice(1);
  if(!phone.startsWith('+62')) phone = '+62' + phone;
  if(phone.length < 11){ showError('Nomor WA salah'); return; }
  try{
    confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
    document.getElementById('otpBox').style.display = 'block';
    alert('Kode OTP dikirim ke ' + phone + '\n\nCek SMS!');
  }catch(e){
    showError('Gagal kirim OTP: ' + e.message);
    console.error(e);
  }
};

document.getElementById('btnVerif').onclick = async function(){
  let code = document.getElementById('otp').value.trim();
  if(code.length != 6){ showError('Kode harus 6 digit'); return; }
  try{
    const result = await confirmationResult.confirm(code);
    const user = result.user;
    await ensureUserExists(user, { provider: 'phone', phone: user.phoneNumber });
    showLoading('Login berhasil!');
    setTimeout(redirectAfterLogin, 300);
  }catch(e){
    showError('Kode salah: ' + e.message);
  }
};

// ============================================
// DISCORD & TIKTOK
// ============================================
document.getElementById('btnDiscord').onclick = function(){
  window.location.href = '/api/auth/discord';
};

document.getElementById('btnTiktok').onclick = function(){
  window.location.href = '/api/auth/tiktok';
};
</script>
</body>
</html>
