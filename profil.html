<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profil - WafaStoreOnly</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./sidebar.css">
<style>
.profile-hero{background:#141414;border:1px solid #2a2a2a;border-radius:16px;padding:24px;text-align:center;margin-top:8px}
.profile-pic{width:96px;height:96px;border-radius:50%;border:2px solid #2a2a2a;object-fit:cover;background:#1a1a1a;transition:0.15s}
.profile-pic-wrap{position:relative;display:inline-block;cursor:pointer;margin-bottom:4px}
.profile-pic-wrap::after{content:'📷';position:absolute;bottom:4px;right:4px;width:28px;height:28px;background:#4a90e2;border-radius:50%;font-size:13px;display:flex;align-items:center;justify-content:center;border:3px solid #141414;box-shadow:0 2px 8px rgba(0,0,0,0.4);transition:0.15s}
.profile-pic-wrap:hover::after{transform:scale(1.1)}
.profile-pic-wrap:hover .profile-pic{border-color:#4a90e2}
.profile-name{font-size:18px;font-weight:800;color:#e8e8e8;margin-top:14px}
.profile-email{font-size:12px;color:#8a8a8a;margin-top:4px}
.btn-edit-foto{background:#1a1a1a;border:1px solid #2a2a2a;color:#e8e8e8;padding:9px 16px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;margin-top:14px;transition:0.15s;font-family:inherit}
.btn-edit-foto:hover{border-color:#4a90e2;color:#4a90e2}
.locked-input{position:relative}
.locked-input input{background:#0a0a0a;cursor:not-allowed;color:#5a5a5a;padding-right:36px}
.locked-input::after{content:'🔒';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;opacity:0.5}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue, get, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyDTkQVpME0XRQmk9Jo7eDQuf0OFY8stm_8", authDomain: "wafastoreonly.firebaseapp.com", databaseURL: "https://wafastoreonly-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "wafastoreonly", storageBucket: "wafastoreonly.firebasestorage.app", messagingSenderId: "208012194307", appId: "1:208012194307:web:551a540b0151333da69436" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
window.wafaDB = db; window.wafaRef = ref; window.wafaGet = get; window.wafaUpdate = update; window.wafaSet = set;
window.wafaOnValue = onValue; window.wafaRemove = remove;
window.wafaAuth = auth;
let uid = localStorage.getItem('wafa_uid');
if(!uid){ window.location.href='login.html'; }
onAuthStateChanged(auth, (user)=>{ if(user && !localStorage.getItem('wafa_uid')){ localStorage.setItem('wafa_uid', user.uid); } });
</script>
</head>
<body>
<div id="wsContent">
<div class="ws-section">
  <div style="font-weight:800;font-size:20px;color:#e8e8e8">Profil Saya</div>
  <p style="font-size:12px;color:#8a8a8a;margin-top:6px">Kelola data diri & akun kamu</p>

  <div class="profile-hero">
    <div class="profile-pic-wrap" onclick="document.getElementById('inputFotoAlbum').click()" title="Klik buat ganti foto">
      <img id="profileBigPic" class="profile-pic" src="https://ui-avatars.com/api/?name=Wafa&background=1a1a1a&color=e8e8e8" alt="foto">
    </div>
    <div class="profile-name" id="profileBigName">Loading...</div>
    <div class="profile-email" id="profileBigEmail">-</div>
    <button class="btn-edit-foto" onclick="document.getElementById('inputFotoAlbum').click()">📸 Ganti Foto dari Album</button>
    <input type="file" id="inputFotoAlbum" accept="image/*" style="display:none" onchange="gantiFotoProfile(this)">
    <div style="font-size:10px;color:#5a5a5a;margin-top:10px">Max 2MB · auto-crop kotak 200×200</div>
  </div>

  <div class="ws-card">
    <div style="font-weight:700;font-size:14px;color:#e8e8e8;margin-bottom:4px">📋 Data Diri</div>
    <div style="font-size:11px;color:#8a8a8a;margin-bottom:8px">Bisa diedit kapan aja</div>
    <div class="input-group">
      <label>Nama / Nickname</label>
      <input id="bigInputNama" placeholder="Isi nama kamu...">
    </div>
    <div class="input-group">
      <label>Tanggal Lahir</label>
      <input id="bigInputTgl" type="date">
    </div>
    <button class="btn btn-primary" onclick="simpanDataDiri()">💾 Simpan Perubahan</button>
  </div>

  <div class="ws-card">
    <div style="font-weight:700;font-size:14px;color:#e8e8e8;margin-bottom:4px">🔒 Data Login</div>
    <div style="font-size:11px;color:#8a8a8a;margin-bottom:12px">Tidak bisa diedit (terikat akun Google)</div>

    <div class="input-group">
      <label>Email / Gmail</label>
      <div class="locked-input"><input id="lockEmail" disabled value="-"></div>
    </div>
    <div class="input-group">
      <label>Metode Login</label>
      <div class="locked-input"><input id="lockMethod" disabled value="-"></div>
    </div>
    <div class="input-group">
      <label>UID Akun</label>
      <div class="locked-input"><input id="lockUid" disabled value="-"></div>
    </div>
    <div class="input-group">
      <label>Tanggal Daftar</label>
      <div class="locked-input"><input id="lockJoin" disabled value="-"></div>
    </div>
  </div>

  <div class="ws-card">
    <div style="font-weight:700;font-size:14px;color:#e8e8e8;margin-bottom:12px">⚙️ Kelola Akun</div>
    <button class="btn btn-grey" onclick="gantiAkun()">🔄 Ganti Akun / Login Gmail Lain</button>
    <button class="btn btn-red" onclick="logout()">🚪 Logout Akun</button>
  </div>
</div>
</div>

<script src="./sidebar.js"></script>
<script>
let currentUser = null;

if(typeof wsSetActive==='function') wsSetActive('profil');
if(typeof wsSetTitle==='function') wsSetTitle('👤 Profil Saya');

if(window.wafaAuth){
  window.wafaAuth.onAuthStateChanged(async (user)=>{
    if(!user) return;
    currentUser = user;

    const pic = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName||user.email)}&background=1a1a1a&color=e8e8e8`;
    document.getElementById('profileBigPic').src = pic;
    document.getElementById('profileBigName').innerText = user.displayName || user.email.split('@')[0];
    document.getElementById('profileBigEmail').innerText = user.email;
    document.getElementById('lockEmail').value = user.email;
    document.getElementById('lockUid').value = user.uid;
    document.getElementById('lockJoin').value = user.metadata && user.metadata.creationTime ? new Date(user.metadata.creationTime).toLocaleDateString('id-ID') : '-';

    let metode = 'Email/Password';
    if(user.providerData && user.providerData[0]){
      const p = user.providerData[0].providerId;
      if(p === 'google.com') metode = 'Google (Gmail)';
      else if(p === 'password') metode = 'Email & Password';
      else if(p === 'phone') metode = 'Nomor HP (OTP)';
    }
    document.getElementById('lockMethod').value = metode;

    try{
      if(window.wafaDB && window.wafaGet){
        const snap = await window.wafaGet(window.wafaRef(window.wafaDB, 'users/' + user.uid));
        const d = snap.val();
        if(d){
          if(d.nickname){
            document.getElementById('bigInputNama').value = d.nickname;
            document.getElementById('profileBigName').innerText = d.nickname;
          }
          if(d.birthDate || d.tanggalLahir) document.getElementById('bigInputTgl').value = d.birthDate || d.tanggalLahir;
          // PRIORITAS: avatar (field baru) → photoBase64 (field lama) → photoURL → Google photoURL
          const fotoSrc = d.avatar || d.photoBase64 || d.photoURL;
          if(fotoSrc) document.getElementById('profileBigPic').src = fotoSrc;
          // Auto-migrasi field lama → baru (sekali aja)
          if(d.photoBase64 && !d.avatar){
            window.wafaUpdate(window.wafaRef(window.wafaDB, 'users/' + user.uid), { avatar: d.photoBase64 }).catch(()=>{});
          }
        }
      }
    }catch(e){ console.log('Load user error:', e); }
  });
}

// ===== RESIZE GAMBAR (SAMA KAYAK SIDEBAR) =====
function resizeImageProfil(file, maxSize){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        try{
          const canvas = document.createElement('canvas');
          canvas.width = maxSize; canvas.height = maxSize;
          const ctx = canvas.getContext('2d');
          const size = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - size)/2, (img.height - size)/2, size, size, 0, 0, maxSize, maxSize);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        }catch(err){ reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function gantiFotoProfile(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  if(file.size > 2*1024*1024){ alert('❌ Foto max 2MB ya!'); return; }
  if(typeof wsToast === 'function') wsToast('⏳ Upload foto...');
  try{
    const base64 = await resizeImageProfil(file, 200);
    document.getElementById('profileBigPic').src = base64;
    const uid = localStorage.getItem('wafa_uid') || (currentUser && currentUser.uid);
    if(!uid){ alert('UID ga ketemu, login ulang!'); return; }
    // Pakai field 'avatar' biar sinkron sama sidebar.js & admin panel
    await window.wafaUpdate(window.wafaRef(window.wafaDB, 'users/' + uid), {
      avatar: base64,
      avatarUpdatedAt: Date.now()
    });
    if(typeof wsToast === 'function') wsToast('✅ Foto profil berhasil diganti!');
    else alert('✅ Foto berhasil diganti!');
    // Refresh sidebar userbox biar langsung update
    if(typeof wsLoadUser === 'function') wsLoadUser();
  }catch(err){ alert('❌ Gagal simpan: '+err.message); }
}

async function simpanDataDiri(){
  const nama = document.getElementById('bigInputNama').value.trim();
  const tgl = document.getElementById('bigInputTgl').value;
  if(!nama){ alert('Isi nama dulu ya!'); return; }
  const uid = localStorage.getItem('wafa_uid') || (currentUser && currentUser.uid);
  if(!uid) return;
  try{
    const payload = { nickname: nama, displayName: nama };
    if(tgl){ payload.birthDate = tgl; payload.tanggalLahir = tgl; }
    await window.wafaUpdate(window.wafaRef(window.wafaDB, 'users/' + uid), payload);
    document.getElementById('profileBigName').innerText = nama;
    let curUser = JSON.parse(localStorage.getItem('wafa_user')||'{}');
    curUser.nickname = nama; localStorage.setItem('wafa_user', JSON.stringify(curUser));
    if(typeof wsToast === 'function') wsToast('✅ Data diri berhasil disimpan!');
    else alert('✅ Data diri tersimpan!');
    if(typeof wsLoadUser === 'function') wsLoadUser();
    if(typeof wsRenderUserAvatar === 'function') wsRenderUserAvatar();
  }catch(e){ alert('❌ Gagal simpan: '+e.message); }
}

function gantiAkun(){
  if(confirm('Mau ganti akun Gmail lain? Kamu akan logout dulu.')){
    logout();
  }
}
function logout(){
  localStorage.removeItem('wafa_uid');
  window.wafaAuth.signOut().then(()=>{ location.href='login.html'; }).catch(()=>{ location.href='login.html'; });
}

// ===== LOAD BRANDING =====
function loadBrandingProfil(){
  if(!window.wafaDB || !window.wafaRef || !window.wafaOnValue){
    setTimeout(loadBrandingProfil, 500);
    return;
  }
  window.wafaOnValue(window.wafaRef(window.wafaDB, 'settings/branding'), (snap)=>{
    const d = snap.val();
    if(!d) return;
    if(d.logo){
      const sbLogo = document.querySelector('.ws-logo img');
      if(sbLogo) sbLogo.src = d.logo;
    }
    if(d.brandName){
      const brandEl = document.querySelector('.ws-logo span');
      if(brandEl) brandEl.innerText = d.brandName;
      document.title = 'Profil - ' + d.brandName;
    }
  });
}
if(document.readyState === 'complete'){ loadBrandingProfil(); } else { window.addEventListener('load', loadBrandingProfil); }
</script>
</body>
</html>
